# Render Blueprint (New > Blueprint)
services:
  - type: web
    name: paytm-round-one-assignment
    runtime: docker
    plan: free
    healthCheckPath: /readyz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: paytm-round-one-assignment-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # deliberately public so reviewers can run ./burst.sh against the deployment; only gates /auth/token
      - key: ADMIN_KEY
        value: demo-admin-key
databases:
  - name: paytm-round-one-assignment-db
    plan: free
